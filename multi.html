<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐉 端午 VR 绘画 - Dragon Boat Festival VR Paint</title>
    <meta name="description" content="端午安康！在虚拟现实中用VR画笔绘制龙舟、粽子、五彩绳… 支持多人在线协作">
    <meta name="keywords" content="端午节, Dragon Boat Festival, VR, painting, WebXR, A-Frame, 龙舟, 粽子, 端午安康, 多人协作">
    <link rel="icon" href="data:,">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clipboard@1.5.12/dist/clipboard.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-gltf-exporter-component@0.1.0/dist/aframe-gltf-exporter-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
    <!-- 多人绘画 + WebGPU -->
    <script src="multiplayer/multiplayer-client.js"></script>
    <script src="multiplayer/multiplayer-integration.js"></script>
    <script src="multiplayer/webgpu-renderer.js"></script>
    <script src="multiplayer/commercial-dragonboat-scene.js"></script>
    <style>
        /* 统一入口弹窗 */
        #welcome-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .modal-content {
            background: linear-gradient(135deg, #1a0a2e 0%, #1a1a3e 50%, #0a1628 100%);
            padding: 40px 45px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ffd700;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), 0 0 60px rgba(196, 30, 58, 0.15);
        }
        .modal-content h1 {
            color: #ffd700;
            margin: 0 0 5px 0;
            font-size: 28px;
        }
        .modal-content .subtitle {
            color: #c41e3a;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-content .desc {
            color: #8fa4c4;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .modal-content input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 1px solid #2a3a5e;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background: #0a0e27;
            color: #fff;
            transition: border-color 0.3s;
        }
        .modal-content input:focus {
            outline: none;
            border-color: #ffd700;
        }
        .modal-content input::placeholder {
            color: #4a5a7e;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .btn-row button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-solo {
            background: #2a3a5e;
            color: #a0b4d4;
        }
        .btn-solo:hover {
            background: #3a4a6e;
            color: #fff;
        }
        .btn-multi {
            background: linear-gradient(135deg, #c41e3a, #ffd700);
            color: #fff;
        }
        .btn-multi:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.4);
        }
        .divider {
            color: #4a5a7e;
            margin: 15px 0;
            font-size: 13px;
        }
        .share-link {
            background: #0a0e27;
            padding: 10px 12px;
            border-radius: 8px;
            color: #00d9ff;
            font-size: 12px;
            word-break: break-all;
            margin-top: 12px;
            border: 1px solid #1a2a4e;
            text-align: left;
        }
        .instructions {
            background: #0a0e27;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-top: 15px;
            color: #6a7a9e;
            font-size: 13px;
            line-height: 1.6;
        }
        .instructions strong {
            color: #8fa4c4;
        }
        /* 在线状态栏 */
        #online-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.9);
            padding: 8px 20px;
            border-radius: 20px;
            color: #8fa4c4;
            font-size: 13px;
            z-index: 1000;
            border: 1px solid #1a2a4e;
            backdrop-filter: blur(8px);
            display: none;
        }
        #online-bar .dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #00d9ff;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        /* 端午主题横幅 */
        #festival-banner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(196, 30, 58, 0.95), rgba(139, 69, 19, 0.95));
            padding: 12px 30px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            border: 3px solid #ffd700;
            backdrop-filter: blur(10px);
            animation: bannerGlow 3s ease-in-out infinite;
            display: none;
            color: #fff;
            font-size: 14px;
        }
        @keyframes bannerGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(196, 30, 58, 0.4), 0 0 40px rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 30px rgba(196, 30, 58, 0.6), 0 0 60px rgba(255, 215, 0, 0.4); }
        }
    </style>
</head>
<body>
    <!-- 统一欢迎弹窗 -->
    <div id="welcome-modal">
        <div class="modal-content">
            <h1>🐉 端午 VR 绘画</h1>
            <div class="subtitle">DRAGON BOAT FESTIVAL</div>
            <div class="desc">用 VR 画笔画出端午的记忆！龙舟、粽子、五彩绳…<br>支持多人在线协作绘画</div>
            
            <input type="text" id="player-name" placeholder="你的名字">
            <input type="text" id="room-id" placeholder="房间号（多人模式必填）">
            
            <div class="btn-row">
                <button class="btn-solo" onclick="startSolo()">🖌️ 单人模式</button>
                <button class="btn-multi" onclick="joinRoom()">👥 多人协作</button>
            </div>
            
            <div class="instructions">
                <strong>🎮 使用说明</strong><br>
                • 单人模式：直接开始绘画<br>
                • 多人协作：输入房间号，分享链接给朋友<br>
                • VR 设备：戴上头显即可沉浸绘画<br>
                • 桌面模式：鼠标拖动绘画，WASD 移动
            </div>
            
            <div id="share-container" style="display:none;">
                <div class="divider">📤 分享链接给朋友</div>
                <div class="share-link" id="share-link"></div>
            </div>
        </div>
    </div>

    <!-- 端午主题横幅 -->
    <div id="festival-banner">🐉 端午安康 — 用 VR 画笔画出端午的记忆 🎋</div>

    <!-- 在线状态栏 -->
    <div id="online-bar"><span class="dot"></span><span id="online-text">已连接</span></div>

    <a-scene vr-analytics renderer="colorManagement: true">
        <a-assets timeout="1000">
            <audio id="ui_click0" crossorigin="anonymous" src="https://cdn.aframe.io/a-painter/sounds/ui_click0.ogg"></audio>
            <audio id="ui_click1" crossorigin="anonymous" src="https://cdn.aframe.io/a-painter/sounds/ui_click1.ogg"></audio>
            <audio id="ui_menu" crossorigin="anonymous" src="https://cdn.aframe.io/a-painter/sounds/ui_menu.ogg"></audio>
            <audio id="ui_undo" crossorigin="anonymous" src="https://cdn.aframe.io/a-painter/sounds/ui_undo.ogg"></audio>
            <audio id="ui_tick" crossorigin="anonymous" src="https://cdn.aframe.io/a-painter/sounds/ui_tick.ogg"></audio>
            <audio id="ui_paint" crossorigin="anonymous" src="https://cdn.aframe.io/a-painter/sounds/ui_paint.ogg"></audio>
        </a-assets>
        
        <!-- 夜空 -->
        <a-sky id="sunset-sky"
               geometry="primitive:sphere; radius:50; phiLength:360; phiStart:0; thetaLength:180"
               material="shader: flat; side:back; color: #1a0a2e">
        </a-sky>

        <a-light type="point" light="color: #fff; intensity:0.6" position="3 10 1"></a-light>
        <a-light type="point" light="color: #ffd700; intensity:0.3" position="-8 12 -20"></a-light>
        <a-light type="hemisphere" groundColor="#888" intensity="0.8"></a-light>
        
        <a-entity id="logo" logo-model
                  animation="dur: 4000; property: logo-model.opacity; from: 1; to: 0; startEvents: painting-started"></a-entity>
        
        <a-entity id="ground"
                  geometry="primitive: box; width: 12; height: 0.01; depth: 12"
                  material="shader: flat; color: #1e9fc2"></a-entity>

        <!-- ═══════════════════════════════════ -->
        <!--  端午节主题场景元素                     -->
        <!-- ═══════════════════════════════════ -->

        <!-- 龙船（精细版） -->
        <a-entity id="dragon-boat-real" position="-5 0.15 -8" rotation="0 25 0">
          <a-cylinder position="0 0.1 0" rotation="0 0 90" radius="0.35" height="2.8" color="#8b4513"></a-cylinder>
          <a-cylinder position="0 0.05 0" rotation="0 0 90" radius="0.4" height="2.5" color="#6b3410" material="opacity: 0.9"></a-cylinder>
          <a-cone position="-0.8 0.3 0.38" rotation="90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-cone position="-0.3 0.32 0.38" rotation="90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-cone position="0.2 0.32 0.38" rotation="90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-cone position="0.7 0.3 0.38" rotation="90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-cone position="-0.8 0.3 -0.38" rotation="-90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-cone position="-0.3 0.32 -0.38" rotation="-90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-cone position="0.2 0.32 -0.38" rotation="-90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-cone position="0.7 0.3 -0.38" rotation="-90 0 0" radius-bottom="0.08" radius-top="0.02" height="0.15" color="#c41e3a"></a-cone>
          <a-sphere position="1.5 0.15 0" radius="0.35" color="#c41e3a"></a-sphere>
          <a-sphere position="1.7 0.2 0" radius="0.28" color="#a01830"></a-sphere>
          <a-sphere position="1.85 0.25 0" radius="0.2" color="#8b0000"></a-sphere>
          <a-cone position="2.0 0.1 0" rotation="0 0 -90" radius-bottom="0.25" radius-top="0.1" height="0.4" color="#c41e3a"></a-cone>
          <a-cone position="2.0 0.18 0.08" rotation="20 0 -90" radius-bottom="0.12" radius-top="0.05" height="0.3" color="#ffd700"></a-cone>
          <a-cone position="2.0 0.18 -0.08" rotation="-20 0 -90" radius-bottom="0.12" radius-top="0.05" height="0.3" color="#ffd700"></a-cone>
          <a-sphere position="1.6 0.35 0.2" radius="0.08" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 1"></a-sphere>
          <a-sphere position="1.6 0.35 -0.2" radius="0.08" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 1"></a-sphere>
          <a-sphere position="1.62 0.35 0.2" radius="0.04" color="#000"></a-sphere>
          <a-sphere position="1.62 0.35 -0.2" radius="0.04" color="#000"></a-sphere>
          <a-cylinder position="1.4 0.55 0.2" rotation="0 0 30" radius="0.04" height="0.5" color="#daa520"></a-cylinder>
          <a-cylinder position="1.4 0.55 -0.2" rotation="0 0 -30" radius="0.04" height="0.5" color="#daa520"></a-cylinder>
          <a-cone position="1.4 0.82 0.2" rotation="0 0 30" radius-bottom="0.06" radius-top="0.02" height="0.2" color="#daa520"></a-cone>
          <a-cone position="1.4 0.82 -0.2" rotation="0 0 -30" radius-bottom="0.06" radius-top="0.02" height="0.2" color="#daa520"></a-cone>
          <a-cylinder position="1.9 0.15 0.3" rotation="0 0 10" radius="0.015" height="0.5" color="#daa520"></a-cylinder>
          <a-cylinder position="1.9 0.15 -0.3" rotation="0 0 -10" radius="0.015" height="0.5" color="#daa520"></a-cylinder>
          <a-cone position="1.3 0.4 0.35" rotation="0 0 60" radius-bottom="0.12" radius-top="0.02" height="0.25" color="#c41e3a"></a-cone>
          <a-cone position="1.3 0.4 -0.35" rotation="0 0 -60" radius-bottom="0.12" radius-top="0.02" height="0.25" color="#c41e3a"></a-cone>
          <a-cylinder position="-1.6 0.1 0" rotation="0 0 90" radius="0.25" height="0.4" color="#c41e3a"></a-cylinder>
          <a-cone position="-1.9 0.2 0.15" rotation="0 0 -60" radius-bottom="0.12" radius-top="0.02" height="0.4" color="#c41e3a"></a-cone>
          <a-cone position="-1.9 0.2 -0.15" rotation="0 0 60" radius-bottom="0.12" radius-top="0.02" height="0.4" color="#c41e3a"></a-cone>
          <a-box position="0 0.4 0" width="2.2" height="0.08" depth="0.1" color="#ffd700"></a-box>
          <a-cylinder position="0 0.45 0" rotation="90 0 0" radius="0.2" height="0.3" color="#c41e3a"></a-cylinder>
          <a-cylinder position="0 0.48 0" rotation="90 0 0" radius="0.22" height="0.04" color="#ffd700"></a-cylinder>
          <a-cylinder position="0.3 0.5 0.55" rotation="70 0 0" radius="0.025" height="0.8" color="#d2691e"></a-cylinder>
          <a-cylinder position="0.3 0.5 -0.55" rotation="110 0 0" radius="0.025" height="0.8" color="#d2691e"></a-cylinder>
          <a-cylinder position="-0.4 0.5 0.55" rotation="70 0 0" radius="0.025" height="0.8" color="#d2691e"></a-cylinder>
          <a-cylinder position="-0.4 0.5 -0.55" rotation="110 0 0" radius="0.025" height="0.8" color="#d2691e"></a-cylinder>
        </a-entity>

        <!-- 远处龙船（缩小版） -->
        <a-entity position="6 0.12 -12" rotation="0 -15 0" scale="0.7 0.7 0.7">
          <a-cylinder position="0 0.1 0" rotation="0 0 90" radius="0.3" height="2.5" color="#8b4513"></a-cylinder>
          <a-sphere position="1.3 0.12 0" radius="0.3" color="#ffd700"></a-sphere>
          <a-cone position="1.5 0.1 0" rotation="0 0 -90" radius-bottom="0.2" radius-top="0.08" height="0.3" color="#ffd700"></a-cone>
          <a-sphere position="1.4 0.25 0.12" radius="0.05" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.8"></a-sphere>
          <a-sphere position="1.4 0.25 -0.12" radius="0.05" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.8"></a-sphere>
          <a-cylinder position="-1.5 0.1 0" rotation="0 0 90" radius="0.2" height="0.3" color="#ffd700"></a-cylinder>
          <a-cone position="-1.8 0.18 0.1" rotation="0 0 -50" radius-bottom="0.1" radius-top="0.02" height="0.3" color="#ffd700"></a-cone>
          <a-cone position="-1.8 0.18 -0.1" rotation="0 0 50" radius-bottom="0.1" radius-top="0.02" height="0.3" color="#ffd700"></a-cone>
        </a-entity>

        <!-- 粽子（写实版） -->
        <a-entity id="zongzi-real" position="2 0.15 -3" rotation="0 30 0">
          <a-box position="0 0.15 0" width="0.35" height="0.25" depth="0.25" color="#f5f5dc" material="opacity: 0.95"></a-box>
          <a-cone position="0 0.35 0" radius-bottom="0.18" radius-top="0" height="0.2" color="#f5f5dc" material="opacity: 0.95"></a-cone>
          <a-box position="0.2 0.15 0" rotation="0 0 15" width="0.4" height="0.02" depth="0.15" color="#228b22"></a-box>
          <a-box position="-0.2 0.15 0" rotation="0 0 -15" width="0.4" height="0.02" depth="0.15" color="#228b22"></a-box>
          <a-box position="0 0.15 0.2" rotation="15 0 0" width="0.15" height="0.02" depth="0.35" color="#228b22"></a-box>
          <a-box position="0 0.15 -0.2" rotation="-15 0 0" width="0.15" height="0.02" depth="0.35" color="#228b22"></a-box>
          <a-torus position="0 0.15 0" rotation="90 0 0" radius="0.13" radius-tubular="0.01" color="#8b4513" material="opacity: 0.9"></a-torus>
        </a-entity>

        <!-- 第二个粽子 -->
        <a-entity position="-2 0.12 -4" rotation="0 -20 0">
          <a-box position="0 0.12 0" width="0.3" height="0.22" depth="0.22" color="#f5f5dc" material="opacity: 0.9"></a-box>
          <a-cone position="0 0.3 0" radius-bottom="0.15" radius-top="0" height="0.18" color="#f5f5dc" material="opacity: 0.9"></a-cone>
          <a-box position="0.18 0.12 0" rotation="0 0 10" width="0.35" height="0.02" depth="0.12" color="#2e8b57"></a-box>
          <a-box position="0 0.12 0.18" rotation="10 0 0" width="0.12" height="0.02" depth="0.3" color="#2e8b57"></a-box>
          <a-torus position="0 0.12 0" rotation="90 0 0" radius="0.11" radius-tubular="0.008" color="#8b4513" material="opacity: 0.85"></a-torus>
        </a-entity>

        <!-- 传统红灯笼 -->
        <a-entity id="lantern-traditional" position="3.5 3.5 -4">
          <a-sphere position="0 0 0" radius="0.35" color="#c41e3a" material="opacity: 0.9"></a-sphere>
          <a-torus position="0 0.32 0" rotation="90 0 0" radius="0.12" radius-tubular="0.015" color="#daa520"></a-torus>
          <a-torus position="0 -0.32 0" rotation="90 0 0" radius="0.12" radius-tubular="0.015" color="#daa520"></a-torus>
          <a-cylinder position="0 0.48 0" radius="0.02" height="0.2" color="#daa520"></a-cylinder>
          <a-sphere position="0 0 0" radius="0.2" color="#ffd700" material="emissive: #ff8c00; emissiveIntensity: 0.8; transparent: true; opacity: 0.7"></a-sphere>
          <a-sphere position="0 0 0" radius="0.6" material="shader: flat; color: #ff8c00; opacity: 0.15; transparent: true">
            <a-animation attribute="material.opacity" from="0.1" to="0.2" dur="3000" direction="alternate" repeat="indefinite"></a-animation>
          </a-sphere>
        </a-entity>

        <!-- 金色灯笼 -->
        <a-entity position="-3 3 -5">
          <a-sphere position="0 0 0" radius="0.28" color="#ffd700" material="opacity: 0.9"></a-sphere>
          <a-torus position="0 0.26 0" rotation="90 0 0" radius="0.1" radius-tubular="0.012" color="#c41e3a"></a-torus>
          <a-torus position="0 -0.26 0" rotation="90 0 0" radius="0.1" radius-tubular="0.012" color="#c41e3a"></a-torus>
          <a-cylinder position="0 0.4 0" radius="0.015" height="0.16" color="#c41e3a"></a-cylinder>
          <a-sphere position="0 0 0" radius="0.16" color="#ff8c00" material="emissive: #ffd700; emissiveIntensity: 0.7; transparent: true; opacity: 0.65"></a-sphere>
          <a-sphere position="0 0 0" radius="0.5" material="shader: flat; color: #ffd700; opacity: 0.12; transparent: true">
            <a-animation attribute="material.opacity" from="0.08" to="0.18" dur="3500" direction="alternate" repeat="indefinite"></a-animation>
          </a-sphere>
        </a-entity>

        <!-- 月亮 -->
        <a-circle position="-8 12 -20" radius="3" material="shader: flat; color: #fffacd; opacity: 0.9; transparent: true">
          <a-animation attribute="material.opacity" from="0.7" to="0.95" dur="8000" direction="alternate" repeat="indefinite"></a-animation>
        </a-circle>
        <a-circle position="-8 12 -21" radius="4.5" material="shader: flat; color: #fffacd; opacity: 0.15; transparent: true"></a-circle>

        <!-- 端午安康文字 -->
        <a-entity id="festival-title" position="0 3 -6" animation="property: position; from: 0 3 -6; to: 0 3.3 -6; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
          <a-text value="端午安康" color="#ffd700" align="center" width="12" font="mozillavr" text="anchor: center; baseline: center"></a-text>
          <a-text value="DRAGON BOAT FESTIVAL" color="#ffffff" align="center" width="8" position="0 -0.5 0" font="mozillavr" text="anchor: center; baseline: center"></a-text>
        </a-entity>

        <!-- 远处雾气 -->
        <a-plane position="0 1.5 -20" rotation="-90 0 0" width="40" height="10"
                material="shader: flat; color: #e8daef; opacity: 0.15; transparent: true">
          <a-animation attribute="material.opacity" from="0.08" to="0.2" dur="10000" direction="alternate" repeat="indefinite"></a-animation>
        </a-plane>

        <!-- 端午安康 3D 文字 -->
        <a-entity id="dragonboat-festival-text" position="0 2.8 -4"
                  text="value: 端午安康; color: #c41e3a; align: center; width: 8; font: mozillavr"
                  animation="property: position; from: 0 2.8 -4; to: 0 3.0 -4; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine">
        </a-entity>

        <!-- 粽子（动画浮动） -->
        <a-entity id="zongzi" position="1.5 0.5 -2" rotation="0 45 0"
                  animation="property: position; from: 1.5 0.5 -2; to: 1.5 0.7 -2; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine">
          <a-cone position="0 0.3 0" radius-bottom="0.15" radius-top="0.08" height="0.5" color="#2d5016" material="opacity: 0.9"></a-cone>
          <a-box position="0 0.3 0" width="0.4" height="0.02" depth="0.02" color="#8b4513"></a-box>
          <a-box position="0 0.3 0" width="0.02" height="0.02" depth="0.4" color="#8b4513"></a-box>
        </a-entity>

        <!-- 粽子2 -->
        <a-entity id="zongzi2" position="-1.5 0.5 -3" rotation="0 -30 0"
                  animation="property: position; from: -1.5 0.5 -3; to: -1.5 0.65 -3; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine">
          <a-cone position="0 0.25 0" radius-bottom="0.12" radius-top="0.06" height="0.4" color="#3a6b1e" material="opacity: 0.9"></a-cone>
          <a-box position="0 0.25 0" width="0.3" height="0.02" depth="0.02" color="#8b4513"></a-box>
        </a-entity>

        <!-- 龙船（动画浮动） -->
        <a-entity id="dragonboat" position="-4 0.2 -6" rotation="0 20 0"
                  animation="property: position; from: -4 0.2 -6; to: -4 0.35 -6; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
          <a-box position="0 0.1 0" width="2.5" height="0.2" depth="0.6" color="#8b4513" material="opacity: 0.9"></a-box>
          <a-cone position="1.4 0.1 0" rotation="0 0 -90" radius-bottom="0.4" radius-top="0.1" height="0.5" color="#c41e3a"></a-cone>
          <a-cone position="-1.4 0.1 0" rotation="0 0 90" radius-bottom="0.4" radius-top="0.1" height="0.5" color="#c41e3a"></a-cone>
          <a-sphere position="1.5 0.25 0.15" radius="0.08" color="#ffd700"></a-sphere>
          <a-sphere position="1.5 0.25 -0.15" radius="0.08" color="#ffd700"></a-sphere>
          <a-box position="0 0.25 0" width="2.8" height="0.02" depth="0.02" color="#ffd700"></a-box>
        </a-entity>

        <!-- 灯笼1（红色） -->
        <a-entity id="lantern1" position="3 3 -3"
                  animation="property: position; from: 3 3 -3; to: 3 3.3 -3; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine">
          <a-sphere position="0 0 0" radius="0.25" color="#c41e3a" material="emissive: #c41e3a; emissiveIntensity: 0.3; transparent: true; opacity: 0.9"></a-sphere>
          <a-cylinder position="0 0.3 0" radius="0.05" height="0.15" color="#ffd700"></a-cylinder>
          <a-cylinder position="0 -0.3 0" radius="0.05" height="0.15" color="#ffd700"></a-cylinder>
          <a-cone position="0 0.4 0" radius-bottom="0.15" radius-top="0.02" height="0.2" color="#8b4513"></a-cone>
          <a-sphere position="0 0 0" radius="0.4" material="color: #ff6b35; opacity: 0.2; transparent: true; shader: flat"></a-sphere>
        </a-entity>

        <!-- 灯笼2（金色） -->
        <a-entity id="lantern2" position="-2.5 2.8 -4"
                  animation="property: position; from: -2.5 2.8 -4; to: -2.5 3.1 -4; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
          <a-sphere position="0 0 0" radius="0.2" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.3; transparent: true; opacity: 0.9"></a-sphere>
          <a-cylinder position="0 0.25 0" radius="0.04" height="0.12" color="#c41e3a"></a-cylinder>
          <a-cylinder position="0 -0.25 0" radius="0.04" height="0.12" color="#c41e3a"></a-cylinder>
          <a-cone position="0 0.35 0" radius-bottom="0.12" radius-top="0.02" height="0.18" color="#8b4513"></a-cone>
        </a-entity>

        <!-- 灯笼3（红色） -->
        <a-entity id="lantern3" position="4 3.5 -5"
                  animation="property: position; from: 4 3.5 -5; to: 4 3.8 -5; dur: 2800; dir: alternate; loop: true; easing: easeInOutSine">
          <a-sphere position="0 0 0" radius="0.22" color="#ff6b35" material="emissive: #ff6b35; emissiveIntensity: 0.3; transparent: true; opacity: 0.9"></a-sphere>
          <a-cylinder position="0 0.28 0" radius="0.045" height="0.14" color="#ffd700"></a-cylinder>
          <a-cylinder position="0 -0.28 0" radius="0.045" height="0.14" color="#ffd700"></a-cylinder>
          <a-cone position="0 0.38 0" radius-bottom="0.14" radius-top="0.02" height="0.2" color="#8b4513"></a-cone>
        </a-entity>

        <!-- 星星粒子 -->
        <a-entity id="particles">
          <a-sphere position="2 4 -5" radius="0.05" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.5"
                   animation="property: material.emissiveIntensity; from: 0.2; to: 1; dur: 1500; dir: alternate; loop: true"></a-sphere>
          <a-sphere position="-3 3.5 -4" radius="0.04" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.5"
                   animation="property: material.emissiveIntensity; from: 0.2; to: 1; dur: 1800; dir: alternate; loop: true"></a-sphere>
          <a-sphere position="1 5 -6" radius="0.06" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.5"
                   animation="property: material.emissiveIntensity; from: 0.2; to: 1; dur: 2000; dir: alternate; loop: true"></a-sphere>
          <a-sphere position="-1 4.5 -5" radius="0.05" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.5"
                   animation="property: material.emissiveIntensity; from: 0.2; to: 1; dur: 1600; dir: alternate; loop: true"></a-sphere>
          <a-sphere position="3.5 4 -4" radius="0.04" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 0.5"
                   animation="property: material.emissiveIntensity; from: 0.2; to: 1; dur: 1900; dir: alternate; loop: true"></a-sphere>
        </a-entity>

        <!-- 芦苇 -->
        <a-entity id="reeds" position="-4 0 -2">
          <a-cylinder position="0 0.8 0" radius="0.02" height="1.6" color="#8b7355"></a-cylinder>
          <a-cylinder position="0.15 0.7 0.1" radius="0.018" height="1.4" color="#9b8465" rotation="0 0 8"></a-cylinder>
          <a-cylinder position="-0.12 0.75 -0.08" radius="0.018" height="1.5" color="#7a6345" rotation="0 0 -5"></a-cylinder>
          <a-cone position="0 1.7 0" radius-bottom="0.06" radius-top="0.01" height="0.4" color="#d4a574"></a-cone>
          <a-cone position="0.15 1.6 0.1" radius-bottom="0.05" radius-top="0.01" height="0.35" color="#c49464" rotation="5 0 10"></a-cone>
          <a-cone position="-0.12 1.65 -0.08" radius-bottom="0.055" radius-top="0.01" height="0.38" color="#b48454" rotation="-3 0 -8"></a-cone>
        </a-entity>

        <!-- ═══════════════════════════════════ -->
        <!--  核心绘画系统                         -->
        <!-- ═══════════════════════════════════ -->

        <a-entity id="hitEntityLeft" geometry="primitive: sphere; radius: 0.08" material="shader:flat; color: #ff3468"></a-entity>
        <a-entity id="hitEntityRight" geometry="primitive: sphere; radius: 0.08" material="shader:flat; color: #ff3468"></a-entity>
        
        <a-entity id="cameraRig">
            <a-entity id="acamera" camera wasd-controls look-controls></a-entity>
            <a-entity id="left-hand"
                      brush
                      paint-controls="hand: left"
                      blink-controls="cameraRig: #cameraRig; startEvents: aim; endEvents: teleport; hitCylinderColor: #ff3468; curveHitColor: #ff3468; curveMissColor: #333333; curveLineWidth: 0.01; hitEntity: #hitEntityLeft"
                      ui></a-entity>
            <a-entity id="right-hand"
                      brush
                      paint-controls="hand: right"
                      blink-controls="cameraRig: #cameraRig; startEvents: aim; endEvents: teleport; hitCylinderColor: #ff3468; curveHitColor: #ff3468; curveMissColor: #333333; curveLineWidth: 0.01; hitEntity: #hitEntityRight"
                      ui></a-entity>
        </a-entity>
    </a-scene>

    <script>
        // ═══════════════════════════════════════════
        //  统一入口逻辑：单人/多人自动切换
        // ═══════════════════════════════════════════
        
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const urlName = params.get('name');
        const urlMulti = params.get('multi');
        const isMultiMode = urlRoom && urlName && urlMulti === '1';
        
        // 填充表单
        if (urlRoom) document.getElementById('room-id').value = urlRoom;
        if (urlName) document.getElementById('player-name').value = urlName;
        
        function generateRoomID() {
            return 'room-' + Math.random().toString(36).substr(2, 6);
        }
        
        // ─── 单人模式 ───
        function startSolo() {
            document.getElementById('welcome-modal').style.display = 'none';
            document.getElementById('festival-banner').style.display = 'block';
            
            // 不初始化 WebSocket，纯本地绘画
            console.log('[VR Paint] 单人模式启动');
        }
        
        // ─── 多人协作 ───
        function joinRoom() {
            const name = document.getElementById('player-name').value || 'Anonymous';
            let room = document.getElementById('room-id').value;
            
            if (!room) {
                room = generateRoomID();
                document.getElementById('room-id').value = room;
            }
            
            // 关闭弹窗
            document.getElementById('welcome-modal').style.display = 'none';
            document.getElementById('festival-banner').style.display = 'block';
            document.getElementById('online-bar').style.display = 'block';
            document.getElementById('online-text').textContent = '房间: ' + room + ' · 已连接';
            
            // 更新 URL（不刷新）
            const url = new URL(window.location.href);
            url.searchParams.set('room', room);
            url.searchParams.set('name', name);
            url.searchParams.set('multi', '1');
            window.history.pushState({}, '', url);
            
            // 显示分享链接
            document.getElementById('share-container').style.display = 'block';
            document.getElementById('share-link').textContent = url.toString();
            
            // 初始化多人绘画
            if (window.vrPaintMultiplayer) {
                window.vrPaintMultiplayer.roomID = room;
                window.vrPaintMultiplayer.playerName = name;
                window.vrPaintMultiplayer.enabled = true;
                window.vrPaintMultiplayer.init();
            }
            
            console.log('[VR Paint] 多人模式启动 · 房间:', room);
        }
        
        // ─── 自动进入（URL 已有完整参数）───
        if (isMultiMode) {
            document.getElementById('welcome-modal').style.display = 'none';
            document.getElementById('festival-banner').style.display = 'block';
            document.getElementById('online-bar').style.display = 'block';
            document.getElementById('online-text').textContent = '房间: ' + urlRoom + ' · 已连接';
            
            setTimeout(() => {
                if (window.vrPaintMultiplayer) {
                    window.vrPaintMultiplayer.roomID = urlRoom;
                    window.vrPaintMultiplayer.playerName = urlName;
                    window.vrPaintMultiplayer.enabled = true;
                    window.vrPaintMultiplayer.init();
                }
            }, 1000);
        }
        
        // ─── 横幅5秒后自动隐藏 ───
        setTimeout(() => {
            const banner = document.getElementById('festival-banner');
            if (banner) {
                banner.style.transition = 'opacity 1s';
                banner.style.opacity = '0';
                setTimeout(() => banner.style.display = 'none', 1000);
            }
        }, 8000);
    </script>
</body>
</html>
