<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR绘画多人版 - VR Paint Multiplayer</title>
    <meta name="description" content="VR绘画多人在线版，基于A-Frame的多人VR协作绘画应用">
    <link rel="icon" href="img/icon-256.png">
    <script src="vendor/aframe-master.min.js"></script>
    <script src="vendor/aframe-input-mapping-component.js"></script>
    <script src="build.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clipboard@1.5.12/dist/clipboard.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-gltf-exporter-component@0.1.0/dist/aframe-gltf-exporter-component.min.js"></script>
    <script src="vendor/aframe-blink-controls.js"></script>
    <script src="vendor/aframe-tooltip-component.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <!-- 多人绘画客户端 -->
    <script src="multiplayer/multiplayer-client.js"></script>
    <style>
        /* 多人模式样式 */
        #join-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: Arial, sans-serif;
        }
        .modal-content {
            background: #1a1a3e;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #0070d1;
            max-width: 400px;
        }
        .modal-content h1 {
            color: #00d9ff;
            margin-bottom: 10px;
        }
        .modal-content p {
            color: #8fa4c4;
            margin-bottom: 20px;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .modal-content input[type="text"] {
            background: #0a0e27;
            color: #fff;
        }
        .modal-content button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #0070d1;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1a82ef;
        }
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #444;
        }
        .share-link {
            background: #0a0e27;
            padding: 10px;
            border-radius: 5px;
            color: #00d9ff;
            font-size: 12px;
            word-break: break-all;
            margin-top: 10px;
        }
        .instructions {
            background: #0a0e27;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-top: 20px;
            color: #8fa4c4;
            font-size: 14px;
        }
        .instructions li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <!-- 加入房间弹窗 -->
    <div id="join-modal">
        <div class="modal-content">
            <h1>🎨 VR Paint 多人版</h1>
            <p>与朋友一起在线绘画！</p>
            
            <input type="text" id="player-name" placeholder="你的名字" value="">
            <input type="text" id="room-id" placeholder="房间号" value="">
            
            <button class="btn-primary" onclick="joinRoom()">加入绘画</button>
            <button class="btn-secondary" onclick="startSolo()">单人模式</button>
            
            <div class="instructions">
                <strong>使用说明：</strong>
                <ul>
                    <li>输入房间号，其他人也输入相同房间号即可一起绘画</li>
                    <li>或者点击「单人模式」单独绘画</li>
                    <li>分享下面的链接给朋友</li>
                </ul>
            </div>
            
            <div id="share-container" style="display:none;">
                <p style="color:#00d9ff; margin-top:15px;">分享链接给朋友：</p>
                <div class="share-link" id="share-link"></div>
            </div>
        </div>
    </div>

    <a-scene vr-analytics renderer="colorManagement: true">
        <a-assets>
            <img id="skymap" src="assets/images/sky.jpg" crossorigin="anonymous">
            <img id="uinormal" src="assets/images/ui-normal.png" crossorigin="anonymous">
            <img id="floor" src="assets/images/floor.jpg" crossorigin="anonymous">
            <a-asset-item id="logoobj" src="assets/models/logo.obj"></a-asset-item>
            <a-asset-item id="logomtl" src="assets/models/logo.mtl"></a-asset-item>
            <a-asset-item id="uiobj" src="assets/models/ui.obj"></a-asset-item>
            <a-asset-item id="hitEntityObj" src="assets/models/TeleportHitEntity.obj"></a-asset-item>
            <a-asset-item id="tipObj" src="assets/models/controller-tip.glb"></a-asset-item>
            <audio id="ui_click0" src="https://cdn.aframe.io/a-painter/sounds/ui_click0.ogg"></audio>
            <audio id="ui_click1" src="https://cdn.aframe.io/a-painter/sounds/ui_click1.ogg"></audio>
            <audio id="ui_menu" src="https://cdn.aframe.io/a-painter/sounds/ui_menu.ogg"></audio>
            <audio id="ui_undo" src="https://cdn.aframe.io/a-painter/sounds/ui_undo.ogg"></audio>
            <audio id="ui_tick" src="https://cdn.aframe.io/a-painter/sounds/ui_tick.ogg"></audio>
            <audio id="ui_paint" src="https://cdn.aframe.io/a-painter/sounds/ui_paint.ogg"></audio>
        </a-assets>
        
        <a-light type="point" light="color: #fff; intensity:0.6" position="3 10 1"></a-light>
        <a-light type="point" light="color: #fff; intensity:0.2" position="-3 -10 0"></a-light>
        <a-light type="hemisphere" groundColor="#888" intensity="0.8"></a-light>
        
        <a-entity id="logo" logo-model
                  animation="dur: 4000; property: logo-model.opacity; from: 1; to: 0; startEvents: painting-started"></a-entity>
        
        <a-entity id="ground"
                  geometry="primitive: box; width: 12; height: 0.01; depth: 12"
                  material="shader: flat; src: #floor"></a-entity>
        
        <a-entity id="sky" geometry="primitive:sphere; radius:30; phiLength:360; phiStart:0; thetaLength:90" material="shader:flat; side:back; height:2048; src:#skymap; width:2048"></a-entity>

        <a-entity id="hitEntityLeft" material="shader:flat; color: #ff3468" obj-model="obj: #hitEntityObj"></a-entity>
        <a-entity id="hitEntityRight" material="shader:flat; color: #ff3468" obj-model="obj: #hitEntityObj"></a-entity>
        
        <a-entity id="cameraRig">
            <a-entity id="acamera" camera></a-entity>
            <a-entity id="left-hand"
                      brush
                      paint-controls="hand: left"
                      blink-controls="cameraRig: #cameraRig; startEvents: aim; endEvents: teleport; hitCylinderColor: #ff3468; curveHitColor: #ff3468; curveMissColor: #333333; curveLineWidth: 0.01; hitEntity: #hitEntityLeft"
                      ui></a-entity>
            <a-entity id="right-hand"
                      brush
                      paint-controls="hand: right"
                      blink-controls="cameraRig: #cameraRig; startEvents: aim; endEvents: teleport; hitCylinderColor: #ff3468; curveHitColor: #ff3468; curveMissColor: #333333; curveLineWidth: 0.01; hitEntity: #hitEntityRight"
                      ui></a-entity>
        </a-entity>
    </a-scene>

    <script>
        // 多人绘画 URL 参数处理
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const urlName = params.get('name');
        const urlMulti = params.get('multi');
        
        // 填充表单
        if (urlRoom) document.getElementById('room-id').value = urlRoom;
        if (urlName) document.getElementById('player-name').value = urlName;
        
        function generateRoomID() {
            return 'room-' + Math.random().toString(36).substr(2, 6);
        }
        
        function joinRoom() {
            const name = document.getElementById('player-name').value || 'Anonymous';
            let room = document.getElementById('room-id').value;
            
            if (!room) {
                room = generateRoomID();
                document.getElementById('room-id').value = room;
            }
            
            // 关闭弹窗
            document.getElementById('join-modal').style.display = 'none';
            
            // 更新 URL
            const url = new URL(window.location.href);
            url.searchParams.set('room', room);
            url.searchParams.set('name', name);
            url.searchParams.set('multi', '1');
            window.history.pushState({}, '', url);
            
            // 显示分享链接
            document.getElementById('share-container').style.display = 'block';
            document.getElementById('share-link').textContent = url.toString();
            
            // 初始化多人绘画
            if (window.vrPaintMultiplayer) {
                window.vrPaintMultiplayer.roomID = room;
                window.vrPaintMultiplayer.playerName = name;
                window.vrPaintMultiplayer.enabled = true;
                window.vrPaintMultiplayer.init();
            }
        }
        
        function startSolo() {
            document.getElementById('join-modal').style.display = 'none';
        }
        
        // 如果 URL 已有完整参数，直接进入
        if (urlRoom && urlName && urlMulti === '1') {
            document.getElementById('join-modal').style.display = 'none';
            setTimeout(() => {
                if (window.vrPaintMultiplayer) {
                    window.vrPaintMultiplayer.roomID = urlRoom;
                    window.vrPaintMultiplayer.playerName = urlName;
                    window.vrPaintMultiplayer.enabled = true;
                    window.vrPaintMultiplayer.init();
                }
            }, 1000);
        }
    </script>
</body>
</html>
